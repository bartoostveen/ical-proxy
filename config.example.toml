# Copy this file to `config.toml` and adjust as needed.
# Set `ICAL_PROXY_CONFIG` to use a configuration file at a different path.

# Listen on 0.0.0.0 when debug is enabled (unless host is set explicitly).
debug = false
port = 8080

# Defaults to 0.0.0.0 in debug mode and 127.0.0.1 otherwise.
# host = "127.0.0.1"

root_url = "https://calendarthing.omeduostuurcentenneef.nl"

# Redis caching is disabled when this is omitted or empty.
# The legacy `host:port` form is accepted as well.
# redis_url = "redis://127.0.0.1:6379"
