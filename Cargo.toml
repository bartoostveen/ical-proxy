[package]
name = "ical-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
chrono = "0.4"
figment = { version = "0.10", default-features = false, features = ["toml"] }
icalendar = { version = "0.17.17", features = ["chrono-tz"] }
redis = { version = "1.8.2", default-features = false, features = [
  "connection-manager",
  "tokio-comp",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "brotli",
  "charset",
  "deflate",
  "gzip",
  "http2",
  "rustls"
] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.7", features = [
  "compression-gzip",
  "cors",
  "set-header",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
